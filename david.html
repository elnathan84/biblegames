<!DOCTYPE html>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'serif': ['Lora', 'serif'],
                        'title': ['Cinzel', 'serif'],
                        'ui': ['Nunito', 'sans-serif'],
                    },
                    colors: {
                        bible: {
                            gold: '#d4af37',
                            red: '#8b0000',
                            blue: '#4a6b8c',
                            earth: '#8b5a2b',
                            sand: '#e8dcc4',
                        }

                }
            }

    <style>
        body {
            background-color: #1a202c;
            touch-action: manipulation;
        }
        
        @keyframes bounce-soft {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        .animate-bounce-soft { animation: bounce-soft 2.5s infinite cubic-bezier(0.45, 0.05, 0.55, 0.95); }
        
        @keyframes walk {
            0% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-8px) rotate(4deg); }
            50% { transform: translateY(0) rotate(0deg); }
            75% { transform: translateY(-8px) rotate(-4deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }
        .animate-walk { animation: walk 0.4s infinite cubic-bezier(0.4, 0, 0.2, 1); }

        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 5px rgba(255,255,255,0.2)); transform: scale(1); }
            50% { filter: drop-shadow(0 0 20px rgba(255,215,0,0.9)); transform: scale(1.08); }
        }
        
        .scene {
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            pointer-events: none;
            transform: scale(0.95);
        }
        .scene.active {
            opacity: 1;
            pointer-events: all;
            transform: scale(1);
        }

        .interactable {
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .interactable:hover {
            transform: scale(1.15) translateY(-8px);
            filter: drop-shadow(0 15px 20px rgba(0,0,0,0.4));
        }
        .interactable:active {
            transform: scale(0.9);
        }
        
        .pulse-hint { animation: pulse-glow 2s infinite ease-in-out; }

        .ill-lg { width: 140px; height: 140px; }
        .ill-md { width: 100px; height: 100px; }
        .ill-sm { width: 60px; height: 60px; }

        @media (max-width: 768px) {
            .ill-lg { width: 100px; height: 100px; }
            .ill-md { width: 70px; height: 70px; }
            .ill-sm { width: 45px; height: 45px; }
        }
    </style>
</head>

    <script>
        const storyScenes = [
            { verse: "1 Samuel 17:12, 15", text: "Now David was the son of that Ephrathite of Bethlehemjudah, whose name was Jesse... But David went and returned from Saul to feed his father's sheep at Bethlehem.", interactionComplete: false },
            { verse: "1 Samuel 17:17-18", text: "And Jesse said unto David his son, Take now for thy brethren an ephah of this parched corn, and these ten loaves, and run to the camp to thy brethren; And carry these ten cheeses unto the captain of their thousand, and look how thy brethren fare.", interactionComplete: false },
            { verse: "1 Samuel 17:20a", text: "And David rose up early in the morning, and left the sheep with a keeper, and took, and went, as Jesse had commanded him...", interactionComplete: false },
            { verse: "1 Samuel 17:20b-22", text: "...and he came to the trench, as the host was going forth to the fight, and shouted for the battle. And David left his carriage in the hand of the keeper of the carriage, and ran into the army, and came and saluted his brethren.", interactionComplete: false }
        ];

        let currentSceneIndex = 0;
        const domVerse = document.getElementById('verse-ref');
        const domText = document.getElementById('story-text');
        const btnNext = document.getElementById('next-btn');
        const btnRestart = document.getElementById('restart-btn');
        let synth = window.speechSynthesis;
        let isSpeaking = false;
        const readBtn = document.getElementById('readBtn');
        const readIcon = document.getElementById('readIcon');
        const readText = document.getElementById('readText');

        function init() { if (!synth) readBtn.style.display = 'none'; loadScene(0); }

        function loadScene(index) {
            document.querySelectorAll('.scene').forEach(el => el.classList.remove('active'));
            document.getElementById(`scene-${index}`).classList.add('active');
            const sceneData = storyScenes[index];
            domVerse.textContent = sceneData.verse;
            domText.textContent = sceneData.text;
            btnNext.classList.remove('scale-100');
            btnNext.classList.add('scale-0');
            if (isSpeaking) speakText(sceneData.text);
            if(index === 2) setupScene3();
        }

        function nextScene() { if (currentSceneIndex < storyScenes.length - 1) { currentSceneIndex++; loadScene(currentSceneIndex); } }

        function showNextButton() {
            storyScenes[currentSceneIndex].interactionComplete = true;
            if (currentSceneIndex === storyScenes.length - 1) { btnRestart.classList.remove('scale-0'); btnRestart.classList.add('scale-100'); }
            else { btnNext.classList.remove('scale-0'); btnNext.classList.add('scale-100'); }
        }

        let sheepGathered = 0;
        function interactScene1(element) {
            if (element.classList.contains('gathered')) return;
            element.classList.add('gathered');
            element.classList.remove('pulse-hint');
            element.style.transition = 'all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            element.style.transform = 'translateY(-30px) scale(1.2)';
            setTimeout(() => {
                element.style.transform = 'translateY(0) scale(1)';
                element.style.opacity = '0.4';
                element.style.filter = 'grayscale(100%)';
                element.classList.remove('interactable');
            }, 500);
            sheepGathered++;
            if (sheepGathered === 3) {
                const prompt = document.getElementById('prompt-0');
                prompt.textContent = "Great job! David's sheep are safe.";
                prompt.classList.replace('text-bible-blue', 'text-green-600');
                showNextButton();
            }
        }

        let foodPacked = 0;
        function interactScene2(element) {
            if (element.classList.contains('packed')) return;
            element.classList.add('packed');
            element.classList.remove('pulse-hint');
            const basket = document.getElementById('basket');
            const basketRect = basket.getBoundingClientRect();
            const elRect = element.getBoundingClientRect();
            const transX = basketRect.left - elRect.left + (basketRect.width/2) - (elRect.width/2);
            const transY = basketRect.top - elRect.top + 20;
            element.style.transition = 'all 0.7s cubic-bezier(0.68, -0.55, 0.265, 1.55)';
            element.style.transform = `translate(${transX}px, ${transY}px) scale(0.2) rotate(360deg)`;
            element.style.opacity = '0';
            setTimeout(() => { element.style.display = 'none'; }, 700);
            foodPacked++;
            if (foodPacked === 3) {
                const prompt = document.getElementById('prompt-1');
                prompt.textContent = "The basket is full and ready!";
                prompt.classList.replace('text-bible-earth', 'text-green-600');
                basket.classList.add('animate-bounce-soft');
                showNextButton();
            }
        }

        let walkInterval;
        let walkProgress = 0;
        function setupScene3() {
            const btn = document.getElementById('walk-btn');
            const travelers = document.getElementById('travelers');
            const progress = document.getElementById('journey-progress');
            const sun = document.getElementById('sun');
            const bg = document.getElementById('scene-2');
            const startWalking = (e) => {
                if(e) e.preventDefault();
                if (walkProgress >= 100) return;
                travelers.classList.add('animate-walk');
                walkInterval = setInterval(() => {
                    walkProgress += 0.8; 
                    progress.style.width = `${walkProgress}%`;
                    sun.style.top = `${100 - (walkProgress * 0.8)}%`;
                    if (walkProgress > 50) {
                        bg.classList.replace('from-indigo-900', 'from-sky-400');
                        bg.classList.replace('via-purple-800', 'via-blue-300');
                    }
                    if (walkProgress >= 100) {
                        stopWalking();
                        document.getElementById('prompt-2').innerHTML = "<span class='text-green-600'>David has arrived at the valley!</span>";
                        showNextButton();
                    }
                }, 30);
            };
            const stopWalking = () => { travelers.classList.remove('animate-walk'); clearInterval(walkInterval); };
            btn.addEventListener('mousedown', startWalking);
            btn.addEventListener('mouseup', stopWalking);
            btn.addEventListener('mouseleave', stopWalking);
            btn.addEventListener('touchstart', startWalking, {passive: false});
            btn.addEventListener('touchend', stopWalking);
            btn.addEventListener('touchcancel', stopWalking);
        }

        let baggageLeft = false;
        function interactScene4Baggage(element) {
            if (baggageLeft) return;
            baggageLeft = true;
            element.classList.remove('pulse-hint');
            element.style.transition = 'all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            const keeper = document.getElementById('keeper');
            const david = document.getElementById('david-final');
            const prompt = document.getElementById('prompt-3');
            element.style.transform = `translate(60px, -20px) scale(0.6)`;
            keeper.classList.add('animate-bounce-soft');
            setTimeout(() => {
                keeper.classList.remove('animate-bounce-soft');
                prompt.textContent = "Now click David to make him run to his brothers!";
                prompt.classList.replace('text-stone-800', 'text-bible-blue');
                david.classList.remove('opacity-50', 'pointer-events-none');
                david.classList.add('interactable', 'opacity-100', 'pulse-hint');
            }, 600);
        }

        function interactScene4David() {
            if (!baggageLeft) return;
            const david = document.getElementById('david-final');
            const prompt = document.getElementById('prompt-3');
            david.classList.remove('interactable', 'pulse-hint');
            david.style.transition = 'transform 2s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
            david.classList.add('animate-walk');
            const distance = window.innerWidth < 768 ? 150 : 350;
            david.style.transform = `translateX(${distance}px)`; 
            setTimeout(() => {
                david.classList.remove('animate-walk');
                prompt.textContent = "David found his brethren! The end.";
                prompt.classList.replace('text-bible-blue', 'text-green-600');
                showNextButton();
            }, 2000);
        }

        function toggleReadAloud() {
            if (isSpeaking) stopReading();
            else {
                isSpeaking = true;
                readIcon.className = "fas fa-stop";
                readText.textContent = "Stop Reading";
                readBtn.classList.add('bg-bible-red', 'text-white');
                readBtn.classList.remove('bg-bible-sand', 'text-bible-earth');
                speakText(storyScenes[currentSceneIndex].text);
            }
        }

        function speakText(text) {
            if (!synth || !isSpeaking) return;
            synth.cancel(); 
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.85; 
            utterance.pitch = 1;
            synth.speak(utterance);
        }

        function stopReading() {
            if (synth) synth.cancel();
            isSpeaking = false;
            readIcon.className = "fas fa-volume-up";
            readText.textContent = "Read Aloud";
            readBtn.classList.remove('bg-bible-red', 'text-white');
            readBtn.classList.add('bg-bible-sand', 'text-bible-earth');
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
